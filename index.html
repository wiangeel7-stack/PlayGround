<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10102b">
<title>POW! Plaza</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Paytone+One&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10102b;color:#fff;font-family:'Space Grotesk',sans-serif}canvas{display:block;position:fixed;inset:0;outline:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(8,7,30,.38) 100%);z-index:1}.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none}.top{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-start}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#ffe75c,#ff8b38);color:#542b82;display:grid;place-items:center;font:26px 'Paytone One';transform:rotate(-7deg);box-shadow:0 6px 24px #ffae4166}.brand h1{font:700 19px 'Space Grotesk';letter-spacing:.04em;margin:0}.brand small{display:block;color:#aab1de;font-size:10px;letter-spacing:.2em;margin-top:3px}.stats{display:flex;gap:10px}.pill{padding:10px 15px;border-radius:14px;background:#17173fbb;border:1px solid #ffffff20;backdrop-filter:blur(12px);font-size:13px;font-weight:700;letter-spacing:.03em;box-shadow:0 8px 24px #06061a40}.pill b{color:#ffe66a;margin-right:5px}.right{display:flex;gap:9px;align-items:center}.sound{pointer-events:auto;border:1px solid #ffffff25;background:#17173fbb;color:white;width:41px;height:41px;border-radius:13px;cursor:pointer;font-size:17px}
.copy{position:absolute;left:28px;bottom:32px;max-width:330px}.eyebrow{font-size:10px;letter-spacing:.25em;color:#a8b7ff;font-weight:700}.copy h2{font-size:32px;line-height:1.04;margin:9px 0 7px;letter-spacing:-.04em}.copy p{font-size:13px;color:#c5c9e6;line-height:1.6;margin:0}.key{display:inline-grid;place-items:center;min-width:22px;height:22px;border:1px solid #ffffff45;border-radius:6px;margin:0 2px;color:#fff;font-size:10px;font-weight:700;background:#ffffff14}.task{position:absolute;right:28px;bottom:30px;text-align:right}.task-title{font-size:10px;letter-spacing:.23em;color:#a8b7ff;font-weight:700}.task-line{font-size:15px;margin-top:7px;font-weight:600}.progress{width:170px;height:5px;background:#ffffff22;border-radius:5px;margin:10px 0 0 auto;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ffdf5b,#ff8c56);border-radius:5px;width:0%;transition:width .3s}.toast{position:absolute;top:100px;left:50%;transform:translate(-50%,-12px);padding:11px 20px;background:#17173fdc;border:1px solid #ffffff35;border-radius:30px;font-weight:700;font-size:13px;opacity:0;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}.touch{display:none;pointer-events:auto;position:absolute;bottom:105px;left:20px;gap:8px}.touch button{width:48px;height:48px;border-radius:16px;border:1px solid #ffffff30;color:#fff;background:#22234dcc;font-size:18px;touch-action:none}.jump{display:none;position:absolute;right:25px;bottom:110px;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff44;background:#ffb53ecc;color:#fff;font-weight:700;pointer-events:auto;touch-action:none}.start-hint{position:absolute;top:83px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#e3e5ff;font-size:11px;letter-spacing:.1em;background:#14143899;border:1px solid #ffffff20;border-radius:20px;padding:8px 13px}
@media(max-width:650px){.top{top:14px;left:14px;right:14px}.brand h1{font-size:16px}.logo{width:39px;height:39px}.stats{gap:5px}.pill{padding:9px 10px;font-size:11px}.copy{left:16px;bottom:18px;max-width:240px}.copy h2{font-size:25px}.copy p{font-size:11px}.task{right:15px;bottom:20px}.task-line{font-size:12px}.progress{width:120px}.start-hint{top:69px;font-size:9px}.touch,.jump{display:flex}.touch{bottom:100px}.jump{display:block}.sound{width:36px;height:36px}}
</style></head>
<body><div class="vignette"></div><div class="grain"></div><div class="hud">
<div class="top"><div class="brand"><div class="logo">P!</div><div><h1>POW! PLAZA</h1><small>THE HANGOUT</small></div></div><div class="right"><div class="stats"><div class="pill"><b>✦</b><span id="score">00</span></div><div class="pill"><b>◷</b><span id="clock">0:45</span></div></div><button class="sound" id="sound" aria-label="Toggle sound">♫</button></div></div>
<div class="start-hint">WASD / ARROWS TO MOVE &nbsp;·&nbsp; SPACE TO JUMP</div><div class="toast" id="toast">NICE PICKUP! +1 ✦</div>
<div class="copy"><div class="eyebrow">YOUR LOBBY. YOUR LEGEND.</div><h2>Make some<br>noise.</h2><p>Explore the plaza and grab the floating stars before the lights go out.</p></div>
<div class="task"><div class="task-title">PLAZA CHALLENGE</div><div class="task-line"><span id="goal">Collect 8 stars</span></div><div class="progress"><i id="bar"></i></div></div>
<div class="touch"><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="up">↑</button><button data-dir="right">→</button></div><button class="jump" id="jump">JUMP</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11112e);scene.fog=new THREE.Fog(0x11112e,22,58);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(0,7.5,12.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7d4ff,0x30204f,2));const key=new THREE.DirectionalLight(0xffe6c6,3);key.position.set(-5,12,8);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const pink=new THREE.PointLight(0xff348f,40,18);pink.position.set(-7,4,-5);scene.add(pink);const cyan=new THREE.PointLight(0x38d9ff,35,18);cyan.position.set(7,4,-4);scene.add(cyan);
const mat=(color,rough=.5,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const floorMat=mat(0x29284d,.75), gold=mat(0xffd64b,.27,.25), lilac=mat(0x7867d9,.35,.2), dark=mat(0x171733,.55), white=mat(0xfff1dc,.3), teal=mat(0x3ce4d0,.27,.15), coral=mat(0xff527e,.32);
function box(parent,x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// Floating circular plaza
const disk=new THREE.Mesh(new THREE.CylinderGeometry(11,11.35,.8,96),floorMat);disk.position.y=-.48;disk.receiveShadow=true;disk.castShadow=true;scene.add(disk);
for(let r of [7.6,9.3,10.8]){let ring=new THREE.Mesh(new THREE.TorusGeometry(r,.045,8,120),r===9.3?gold:lilac);ring.rotation.x=Math.PI/2;ring.position.y=-.04;scene.add(ring)}
// Tiles and floor accents
for(let i=0;i<24;i++){let a=i*Math.PI/12;let o=box(scene,Math.cos(a)*8.45,.015,Math.sin(a)*8.45,.12,.04,.68,i%3===0?gold:lilac);o.rotation.y=-a}
// Stage and neon portal
const stage=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.5,.25,64),mat(0x393564,.36,.25));stage.position.set(0,.04,-1.6);stage.receiveShadow=true;scene.add(stage);
let stageRing=new THREE.Mesh(new THREE.TorusGeometry(3.2,.09,10,72),teal);stageRing.rotation.x=Math.PI/2;stageRing.position.set(0,.2,-1.6);scene.add(stageRing);
// Portal hoop arch
const arch=new THREE.Mesh(new THREE.TorusGeometry(1.55,.11,12,64,Math.PI),new THREE.MeshStandardMaterial({color:0x5ef6e6,emissive:0x21cdbc,emissiveIntensity:1.7,metalness:.3,roughness:.22}));arch.position.set(0,2.1,-3.3);scene.add(arch);box(scene,-1.55,1.08,-3.3,.18,2.15,.2,lilac);box(scene,1.55,1.08,-3.3,.18,2.15,.2,lilac);
// Background buildings
for(let i=0;i<16;i++){let a=i*Math.PI/8, r=13.8, h=2+((i*7)%4)*.65;let x=Math.sin(a)*r,z=-Math.cos(a)*r;let b=box(scene,x,h/2-.15,z,1.9,h,1.35,i%2?dark:lilac);b.rotation.y=a*.3;for(let j=0;j<2;j++){let w=box(scene,x+(j-.5)*.65,h*.5,z+.69,.19,.3,.04,i%2?teal:coral);w.material=new THREE.MeshStandardMaterial({color:i%2?0x54f7ed:0xff68a2,emissive:i%2?0x148b8b:0x931a4a,emissiveIntensity:1.5})}}
// Decorative palm-like neon trees
for(let i=0;i<8;i++){let a=i*Math.PI/4+.2,x=Math.sin(a)*6.5,z=Math.cos(a)*6.5;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.11,.18,1.4,8),gold);trunk.position.set(x,.7,z);trunk.castShadow=true;scene.add(trunk);for(let n=0;n<5;n++){let leaf=new THREE.Mesh(new THREE.ConeGeometry(.16,1.05,7),n%2?teal:coral);leaf.position.set(x+Math.cos(n*1.25)*.48,1.56+Math.sin(n*1.25)*.24,z+Math.sin(n*1.25)*.48);leaf.rotation.z=Math.cos(n*1.25)*.75;leaf.rotation.x=Math.sin(n*1.25)*.6;scene.add(leaf)}}
// Simple white box player, facing camera
const player=new THREE.Group();scene.add(player);player.position.set(0,0,2.2);
const body=new THREE.Group();player.add(body);
const playerBox=new THREE.Mesh(new THREE.BoxGeometry(.9,1.8,.72),mat(0xffffff,.55));playerBox.position.y=.9;playerBox.castShadow=true;playerBox.receiveShadow=true;body.add(playerBox);
// Comic POW! pop behind and over the avatar: starburst canvas facing camera
const c=document.createElement('canvas');c.width=512;c.height=300;const ctx=c.getContext('2d');ctx.translate(256,150);ctx.fillStyle='#ffcf3d';ctx.strokeStyle='#ff5a6f';ctx.lineWidth=15;ctx.beginPath();for(let i=0;i<24;i++){let a=i*Math.PI/12,r=i%2?100:139;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.lineWidth=8;ctx.strokeStyle='#fff2ae';ctx.stroke();ctx.font='1000 118px Paytone One, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=12;ctx.strokeStyle='#7830a7';ctx.strokeText('POW!',0,9);ctx.fillStyle='#fff';ctx.fillText('POW!',0,9);
const powTex=new THREE.CanvasTexture(c);powTex.colorSpace=THREE.SRGBColorSpace;const pow=new THREE.Mesh(new THREE.PlaneGeometry(2.8,1.65),new THREE.MeshBasicMaterial({map:powTex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));pow.position.set(.03,3.13,-.58);pow.rotation.y=.07;player.add(pow);
// collectible stars
const pickups=[];const starGeo=new THREE.OctahedronGeometry(.32,0);const starMat=new THREE.MeshStandardMaterial({color:0xffe362,emissive:0xe6a90a,emissiveIntensity:.75,metalness:.18,roughness:.24});
function spawnStars(){pickups.forEach(s=>scene.remove(s.mesh));pickups.length=0;for(let i=0;i<12;i++){let a=i*Math.PI*2/12+.15,r=4.2+(i%3)*1.25;let mesh=new THREE.Mesh(starGeo,starMat);mesh.position.set(Math.cos(a)*r,.95+(i%2)*.38,Math.sin(a)*r);mesh.castShadow=true;scene.add(mesh);let glow=new THREE.PointLight(0xffda49,1.3,2.3);glow.position.copy(mesh.position);scene.add(glow);pickups.push({mesh,glow,base:mesh.position.y,active:true})}}
spawnStars();
// star particles in the sky
const dustGeo=new THREE.BufferGeometry(),dustN=280,dustPos=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){dustPos[i*3]=(Math.random()-.5)*48;dustPos[i*3+1]=Math.random()*15;dustPos[i*3+2]=(Math.random()-.5)*48}dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));scene.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xc2cbff,size:.045,transparent:true,opacity:.75})));
const keys={};let score=0,time=45,jumping=false,vy=0,ended=false,toastTimer;const scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),bar=document.getElementById('bar'),goal=document.getElementById('goal'),toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1250)}
function collect(s){s.active=false;scene.remove(s.mesh,s.glow);score++;scoreEl.textContent=String(score).padStart(2,'0');bar.style.width=Math.min(score/8*100,100)+'%';if(score>=8&&!ended){goal.textContent='Challenge complete!';showToast('PLAZA CHAMPION! ✦');time=Math.max(time,12)}else showToast('NICE PICKUP! +1 ✦')}
function jump(){if(!jumping&&!ended){vy=7.8;jumping=true}}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')jump();if(ended&&e.code==='Enter')reset()});window.addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('.touch button').forEach(b=>{let k={left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown'}[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function reset(){score=0;time=45;ended=false;scoreEl.textContent='00';clockEl.textContent='0:45';goal.textContent='Collect 8 stars';bar.style.width='0%';player.position.set(0,0,2.2);spawnStars();showToast('READY? GO!')}
let last=performance.now(),elapsed=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
if(!ended){let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dz=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);let len=Math.hypot(dx,dz);if(len){dx/=len;dz/=len;player.position.x+=dx*5*dt;player.position.z+=dz*5*dt;player.rotation.y=Math.atan2(dx,dz);body.position.y=Math.abs(Math.sin(elapsed*13))*.055;if(body.children[2])body.children[2].rotation.z=Math.sin(elapsed*13)*.12} else body.position.y=0;
player.position.x=THREE.MathUtils.clamp(player.position.x,-9.6,9.6);player.position.z=THREE.MathUtils.clamp(player.position.z,-8.5,9.4);if(jumping){player.position.y+=vy*dt;vy-=19*dt;if(player.position.y<=0){player.position.y=0;jumping=false;vy=0}}if(score<8){time-=dt;if(time<=0){time=0;ended=true;goal.textContent='Time to chill!';showToast('TIME’S UP — press ENTER to play again')}}clockEl.textContent=`0:${String(Math.ceil(time)).padStart(2,'0')}`;
for(let s of pickups){if(!s.active)continue;s.mesh.rotation.y+=dt*1.8;s.mesh.rotation.x+=dt*.7;s.mesh.position.y=s.base+Math.sin(elapsed*2.7+s.base)*.16;s.glow.position.copy(s.mesh.position);if(player.position.distanceTo(s.mesh.position)<.86)collect(s)}}
pow.rotation.z=Math.sin(elapsed*2.4)*.045;pow.position.y=3.12+Math.sin(elapsed*2.8)*.09;camera.position.x+=(player.position.x*.23-camera.position.x)*dt*2;camera.position.z+=(player.position.z+10.3-camera.position.z)*dt*1.5;camera.lookAt(player.position.x*.16,1.25,player.position.z-1.6);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('sound').addEventListener('click',e=>{e.currentTarget.textContent=e.currentTarget.textContent==='♫'?'♪':'♫';showToast(e.currentTarget.textContent==='♫'?'SOUND ON':'SOUND OFF')});
</script></body></html>
